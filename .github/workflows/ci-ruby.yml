name: CI - Ruby

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration-tests-local:
    name: Local Tests
    uses: ./.github/workflows/bazel.yml
    strategy:
      fail-fast: false
      matrix:
        tag:
          - safari
          - safari-remote
    with:
      name: Local Tests (${{ matrix.tag }}, macos)
      browser: safari
      os: macos
      rerun-with-debug: true
      run: >
        bazel test
        --keep_going
        --build_tests_only
        --flaky_test_attempts 2
        --local_test_jobs 1
        --test_size_filters large
        --test_tag_filters ${{ matrix.tag }}
        //rb/spec/...
